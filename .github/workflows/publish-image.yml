name: Publish image (GHCR)

# Builds the Docker image off-server (the VPS has too little RAM for
# `next build`) and publishes it to GitHub Container Registry.
# NEXT_PUBLIC_* values are inlined at build time, so they come from
# repository variables. Run manually: Actions -> Publish image -> Run.
#
# Required repository variables (Settings -> Secrets and variables ->
# Actions -> Variables): NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_SITE_URL,
# NEXT_PUBLIC_APP_LOCALE. (None are secret: they ship in the client bundle.)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bruno-hao/wacrm:latest
            ghcr.io/bruno-hao/wacrm:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_LOCALE=${{ vars.NEXT_PUBLIC_APP_LOCALE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
