name: Solicitação de funcionalidade
description: Proponha uma nova funcionalidade ou uma melhoria relevante.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela ideia — mas leia isto primeiro.

        Isto é um **template**, não um produto colaborativo. O escopo do
        upstream é intencionalmente estreito, então a maioria dos pedidos de
        funcionalidade acaba como *"construa isto no seu fork"* em vez de
        entrar aqui. Esse é o objetivo de um template.

        Quando um pedido de funcionalidade ao upstream *é* útil:

        - Ele corrige um problema de correção no template.
        - Ele deixa o template mais limpo para o próximo usuário que fizer
          fork (reduzindo atrito, removendo armadilhas).
        - Ele está no escopo de "um template genérico de CRM para WhatsApp",
          e não numa aposta no seu fluxo de trabalho específico.

        Se a funcionalidade é realmente para a sua própria implantação, faça
        o fork e construa lá — veja o
        [CONTRIBUTING.md](https://github.com/ArnasDon/wacrm/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Qual é o problema?
      description: O que você está tentando fazer hoje que o template torna mais difícil do que deveria?
      placeholder: |
        Quando um disparo termina, não tenho como ver quais destinatários
        não responderam para fazer o acompanhamento manualmente.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: O que você gostaria de ver?
      description: Descreva a funcionalidade do ponto de vista do usuário, não da implementação.
      placeholder: |
        Na página de detalhes do disparo, um filtro "Sem resposta" que lista
        os destinatários que receberam mas não responderam em 24 horas.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você considerou
      description: Coisas que mais ou menos funcionam hoje, soluções alternativas, funcionalidades parecidas em outras ferramentas.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Escopo
      description: Seu palpite — reajustaremos se necessário.
      options:
        - Pequeno (algumas horas)
        - Médio (alguns dias)
        - Grande (algumas semanas, provavelmente se divide em vários PRs)
    validations:
      required: false
