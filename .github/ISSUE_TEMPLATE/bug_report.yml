name: Relato de bug
description: Algo no template não está funcionando como a documentação diz que deveria.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Quanto mais específico você for, mais rápido
        conseguimos entregar uma correção.

        **Não é um bug no código?** Se for um problema de segurança, feche
        este formulário e siga o [SECURITY.md](https://github.com/ArnasDon/wacrm/blob/main/.github/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: O que aconteceu?
      description: Uma ou duas frases descrevendo o sintoma.
      placeholder: Ao clicar em uma conversa, a thread fica travada em "Nenhuma mensagem ainda".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Os passos mínimos de que precisamos para provocar o bug do nosso lado.
      placeholder: |
        1. Faça login e vá para /inbox.
        2. Clique em qualquer conversa que tenha mensagens antigas.
        3. O painel da thread mostra "Nenhuma mensagem ainda" até um refresh forçado.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
      placeholder: As mensagens carregam na primeira vez, sempre.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / versão
      description: |
        O SHA do commit ou o release em que você está. `git rev-parse --short HEAD`
        no fork resolve.
      placeholder: "ex.: d6a4677 ou v0.2.0"
    validations:
      required: false

  - type: dropdown
    id: runtime
    attributes:
      label: Onde está rodando?
      options:
        - Desenvolvimento local (npm run dev)
        - Hostinger Managed Node.js
        - Hostinger VPS
        - Vercel
        - Outro host Node
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas de tela
      description: Logs do servidor, erros do console do navegador, aba de rede — qualquer coisa que pareça suspeita. Remova tokens antes de colar.
      render: text
    validations:
      required: false
